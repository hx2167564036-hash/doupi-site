<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" th:href="@{/assets/img/favicon.ico}" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/assets/img/favicon-32.png}" />
  <link rel="apple-touch-icon" th:href="@{/assets/img/apple-touch-icon.png}" />
  <link rel="manifest" th:href="@{/assets/site.webmanifest}" />
  <meta name="theme-color" content="#FAFAFC" />

  <title>分类 · 豆皮</title>
  <link rel="stylesheet" th:href="@{/assets/css/base.css}" />
</head>
<body>

<header th:replace="~{modules/layout :: nav('记录')}"></header>

<main class="wrap">
  <header class="hero">
    <p class="kicker">CATEGORIES</p>
    <h1 class="title">分类</h1>
    <p class="lead">共 <b th:text="${#lists.size(categories)}">6</b> 个分类。</p>
  </header>

  <div class="list">
    <a class="item" th:each="c : ${categories}" th:href="@{${c.status.permalink}}">
      <span class="d" th:text="${c.spec.slug}">daily-record</span>
      <span class="t" th:text="${c.spec.displayName}">每日记录</span>
      <span class="n" th:text="${(c.status.postCount ?: 0) + ' 篇'}">492 篇</span>
    </a>
  </div>
</main>

<footer th:replace="~{modules/layout :: footer}"></footer>
</body>
</html>
